<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FORMATION - AI BATTLE</title>
    <style>
        :root { --bg: #1a1a1d; --panel: #2c2c2e; --accent: #00fbff; --red: #ff4757; --blue: #2ed573; --valid: rgba(255, 255, 255, 0.2); }
        body { background: var(--bg); color: white; font-family: 'Pretendard', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; touch-action: manipulation; }
        .screen { display: none; width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; flex-direction: column; align-items: center; }
        .active { display: flex; }
        .card { background: var(--panel); padding: 25px; border-radius: 20px; width: 100%; border: 1px solid #444; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .btn { width: 100%; padding: 15px; background: var(--accent); color: #000; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; margin-top: 10px; font-size: 1rem; transition: 0.2s; }
        .btn-sub { background: #444; color: #ccc; }
        .board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: #333; padding: 10px; border-radius: 12px; width: 100%; aspect-ratio: 1; min-height: 300px; box-sizing: border-box; }
        .cell { background: #1a1a1d; border-radius: 4px; position: relative; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .stone { width: 80%; height: 80%; border-radius: 50%; box-shadow: inset 0 -3px 5px rgba(0,0,0,0.5); transition: transform 0.2s; }
        .stone.red { background: var(--red); }
        .stone.blue { background: var(--blue); }
        .last-move::after { content: ''; position: absolute; width: 30%; height: 30%; background: #fff; border-radius: 50%; opacity: 0.8; }
        .valid-move { background: var(--valid); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 0.5; } 100% { opacity: 0.2; } }
    </style>
</head>
<body>

    <!-- 메인 로비 화면 -->
    <div id="lobbyScreen" class="screen active">
        <div class="card">
            <h1 style="color:var(--accent);">FORMATION</h1>
            <p style="color:#888; font-size:0.9rem;">오프라인 전략 보드게임 (AI 대전)</p>
            
            <button class="btn" onclick="location.href='index.html'" style="background: #333; color: white; margin-top: 15px;">🎲 루빅스 레이스 가기</button>
            <hr style="border:0; border-top:1px solid #444; margin:15px 0;">
            
            <p style="color:#888; font-size:0.8rem;">🤖 AI 난이도 선택</p>
            <div style="display:flex; gap:5px;">
                <button class="btn btn-sub" onclick="startAI(1)">초급</button>
                <button class="btn btn-sub" onclick="startAI(2)">중급</button>
                <button class="btn btn-sub" onclick="startAI(3)" style="color:var(--red);">고급</button>
            </div>
        </div>
    </div>

    <!-- 게임 플레이 화면 -->
    <div id="gameScreen" class="screen">
        <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:0.9rem;">
                <div id="p1Area"><span id="p1Name" style="color:var(--red); font-weight:bold;">RED (나)</span></div>
                <div id="turnBadge"><span id="turnInfo" style="background:#444; padding:2px 8px; border-radius:6px;">대기중</span></div>
                <div id="p2Area"><span id="p2Name" style="color:var(--blue); font-weight:bold;">BLUE (AI)</span></div>
            </div>
            
            <div id="board" class="board"></div>
            
            <p id="gameMsg" style="color:var(--accent); font-size:1rem; font-weight:bold; height:20px; margin-top:10px;"></p>
            <button id="quitBtn" class="btn btn-sub" onclick="quitGame()">나가기</button>
        </div>
    </div>

    <script>
        // 전역 상태 변수들
        let turn = 1, board = [], lastMove = null;
        let aiLevel = 0, isGameOver = false;

        // 게임 시작 (AI 대전)
        function startAI(level) { 
            aiLevel = level;
            document.getElementById('p2Name').innerText = `BLUE (AI Lv.${level})`;
            showScreen('gameScreen'); 
            initGame(); 
        }

        // 초기화
        function initGame() {
            turn = 1; 
            isGameOver = false; 
            lastMove = null;
            board = Array(7).fill().map(() => Array(7).fill(0));
            document.getElementById('gameMsg').innerText = "";
            
            renderBoard(); 
            updateUI();
        }

        // 보드 그리기
        function renderBoard() {
            const b = document.getElementById('board'); 
            b.innerHTML = '';
            const validMoves = getValidMoves();
            
            for(let r=0; r<7; r++) {
                for(let c=0; c<7; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const val = board[r][c];
                    
                    if(val !== 0) {
                        const stone = document.createElement('div');
                        stone.className = `stone ${val === 1 ? 'red' : 'blue'}`;
                        cell.appendChild(stone);
                        if(lastMove && lastMove.r === r && lastMove.c === c) stone.classList.add('last-move');
                    } else if(!isGameOver) {
                        // 내 차례(RED)일 경우만 클릭 허용
                        if(turn === 1) {
                            if(validMoves.some(m => m.r === r && m.c === c)) {
                                cell.classList.add('valid-move');
                                cell.onclick = () => makeMove(r, c);
                            }
                        }
                    }
                    b.appendChild(cell);
                }
            }
        }
        
        // 놓을 수 있는 위치 계산
        function getValidMoves() {
            let moves = [];
            // 첫 턴에는 아무곳이나 가능
            if(lastMove === null) { 
                for(let r=0; r<7; r++) for(let c=0; c<7; c++) if(board[r][c]===0) moves.push({r,c}); 
                return moves; 
            }
            // 이후 턴에는 마지막 수의 주변 8칸
            for(let dr=-1; dr<=1; dr++) {
                for(let dc=-1; dc<=1; dc++) {
                    if(dr===0 && dc===0) continue;
                    let nr = lastMove.r + dr, nc = lastMove.c + dc;
                    if(nr>=0 && nr<7 && nc>=0 && nc<7 && board[nr][nc]===0) moves.push({r:nr, c:nc});
                }
            }
            // 주변에 둘 곳이 없으면 전체 보드에서 찾음
            if(moves.length === 0) { 
                for(let r=0; r<7; r++) for(let c=0; c<7; c++) if(board[r][c]===0) moves.push({r,c}); 
            }
            return moves;
        }

        // 돌 놓기
        function makeMove(r, c) {
            if(isGameOver) return;
            board[r][c] = turn; 
            lastMove = {r, c};
            
            if(checkWin(r, c, turn)) {
                endGame(turn);
                return;
            }
            
            turn = turn === 1 ? 2 : 1;
            renderBoard(); 
            updateUI(); 
            
            // AI 턴 실행
            if(turn === 2) {
                setTimeout(aiTurn, 600); 
            }
        }

        // AI 로직
        function aiTurn() {
            if(isGameOver) return;
            const validMoves = getValidMoves(); 
            if(validMoves.length === 0) return; 
            
            let pick = validMoves[0];
            
            if(aiLevel > 1) { 
                // AI 승리 가능성 체크
                let winMove = validMoves.find(m => { board[m.r][m.c]=2; let w=checkWin(m.r,m.c,2); board[m.r][m.c]=0; return w; });
                if(winMove) pick = winMove;
                else {
                    // 사용자 승리 방어 체크
                    let blockMove = validMoves.find(m => { board[m.r][m.c]=1; let w=checkWin(m.r,m.c,1); board[m.r][m.c]=0; return w; });
                    if(blockMove) pick = blockMove;
                    else pick = validMoves[Math.floor(Math.random()*validMoves.length)];
                }
            } else { 
                // 1단계: 완전 랜덤
                pick = validMoves[Math.floor(Math.random()*validMoves.length)]; 
            }
            makeMove(pick.r, pick.c);
        }

        // 4목 승리 체크
        function checkWin(r, c, p) {
            const directions = [[0,1], [1,0], [1,1], [1,-1]];
            for(let d of directions) {
                let count = 1;
                for(let k=1; k<4; k++) { let nr=r+d[0]*k, nc=c+d[1]*k; if(nr<0||nr>6||nc<0||nc>6||board[nr][nc]!==p) break; count++; }
                for(let k=1; k<4; k++) { let nr=r-d[0]*k, nc=c-d[1]*k; if(nr<0||nr>6||nc<0||nc>6||board[nr][nc]!==p) break; count++; }
                if(count >= 4) return true;
            }
            return false;
        }

        // UI 갱신 (차례 표시)
        function updateUI() {
            if(isGameOver) return;
            const info = document.getElementById('turnInfo');
            if (turn === 1) { 
                info.innerText = "내 차례";
                info.style.background = "var(--red)";
                document.getElementById('p1Area').style.opacity = "1"; document.getElementById('p2Area').style.opacity = "0.3";
            } else { 
                info.innerText = "AI 차례";
                info.style.background = "var(--blue)";
                document.getElementById('p1Area').style.opacity = "0.3"; document.getElementById('p2Area').style.opacity = "1";
            }
        }

        // 게임 종료 처리
        function endGame(winner) {
            isGameOver = true;
            document.getElementById('turnInfo').innerText = "게임 종료";
            document.getElementById('turnInfo').style.background = "#333";
            
            const msg = winner === 1 ? "🎉 승리!" : "패배...";
            
            document.getElementById('gameMsg').innerText = msg;
            renderBoard();
        }
        
        // 게임 나가기
        function quitGame() {
            if (!confirm("게임을 중단하고 로비로 돌아가시겠습니까?")) return;
            showScreen('lobbyScreen');
        }
        
        // 화면 전환 함수
        function showScreen(id) { 
            document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); 
            document.getElementById(id).classList.add('active'); 
        }
    </script>
</body>
</html>
